version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: stockpilot-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: stockpilot
    volumes:
      - mongodb_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stockpilot-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/stockpilot
      - JWT_ACCESS_SECRET=stockpilot_production_jwt_access_secret_super_secure_key_2026!
      - JWT_REFRESH_SECRET=stockpilot_production_jwt_refresh_secret_super_secure_key_2026!
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: stockpilot-client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  mongodb_data:
